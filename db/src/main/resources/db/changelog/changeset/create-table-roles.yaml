databaseChangeLog:
  - changeSet:
      id: 0
      author: Halaiko Vitalii
      changes:
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                      primaryKey: true
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true