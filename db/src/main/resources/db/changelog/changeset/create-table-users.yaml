databaseChangeLog:
  - changeSet:
      id: 0
      author: Halaiko Vitalii
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: sub
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
                    unique: true
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: picture
                  type: text
                  constraints:
                    nullable: true