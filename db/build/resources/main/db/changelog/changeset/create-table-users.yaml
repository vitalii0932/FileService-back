databaseChangeLog:
  - changeSet:
      id: 1
      author: Halaiko Vitalii
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                      nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                      nullable: false
              - column:
                  name: role_id
                  type: INTEGER
                  constraints:
                    nullable: false
                    references: user_roles(id)
                    foreignKeyName: fk_users_roles